bname: Validate & Deploy GitHub Pages
on:
push:
branches: [ "main", "master" ]
pull_request:
branches: [ "main", "master" ]
permissions:
contents: read
pages: write
id-token: write
concurrency:
group: "pages"
cancel-in-progress: true
jobs:
validate:
runs-on: ubuntu-latest
steps:
- name: Checkout code
uses: actions/checkout@v4
  - name: Validate HTML & Syntax Structure
   run: |
     echo "Checking index.html existence..."
     test -f index.html
     echo "Validating security headers & script tags..."
     ! grep -i "eval(" index.html
deploy:
environment:
name: github-pages
url: ${{ steps.deployment.outputs.page_url }}
runs-on: ubuntu-latest
needs: validate
if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
steps:
- name: Checkout code
uses: actions/checkout@v4
  - name: Setup Pages
   uses: actions/configure-pages@v4

 - name: Upload Artifact
   uses: actions/upload-pages-artifact@v3
   with:
     path: '.'

 - name: Deploy to GitHub Pages
   id: deployment
   uses: actions/deploy-pages@v4
